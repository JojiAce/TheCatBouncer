[Input]
# Kameraquelle (Index oder RTSP-URL)
camera_src = 0

[Backend]
# Unterstützte Werte für engine: onnx, onnxslim, openvino, pt, safetensor, coreml
engine = onnx
# cpu oder gpu
inference_device = cpu
# Anzahl der CPU-Prozesse für die Inferenz (nur bei CPU relevant)
cpu_workers = 2
# Modellgeneration und -größe gemäß Ordnerstruktur
model_generation = YOLO11
model_size = m
# Ordner, in dem sich alle Modelle befinden
inference_model_main_folder = models
# nested oder flat
model_folder_layout = nested

[Active]
# Zielauflösung und FPS für die aktive Analyse
high_resolution = 1280,720
fps_high = 30
# Timeout (Sekunden) bis die aktive Analyse abgebrochen wird
timeout_sec = 60

[Detection]
# Name der Zielklasse und minimal erforderliche Konfidenz
target_class_name = cat
min_confidence = 0.8
# Ordner zum Speichern erfolgreicher Ereignisse
success_frame_folder = successful_detections

[PassivAnalyzerCamera]
# Auflösung und FPS für den passiven Modus
low_resolution = 640,480
fps_low = 5

[PassivAnalyzerTrigger]
# Helligkeitsbasierte Trigger-Logik
# Sobald die Szene dunkler als darkness_threshold ist, wird auf Helligkeitstrigger gewartet
darkness_threshold = 20
# Pixel gelten als hell, wenn sie über brightness_threshold liegen
brightness_threshold = 220
# Anteil heller Pixel, der überschritten werden muss (0.0 - 1.0)
brightness_pixel_percentage = 0.01
# Anzahl aufeinanderfolgender heller Frames, bevor ausgelöst wird
trigger_frame_count = 5

[ColorAnalysis]
analysis_method = hsv
lower_black_hsv = 0,0,0
upper_black_hsv = 180,255,60
black_pixel_threshold = 0.5
# Einstellungen für die LLM-Analyse (optional)
ollama_host = http://localhost:11434
ollama_model = llava
ollama_prompt = Is the cat in this image black? Answer with only "yes" or "no".
ollama_temperature = 0.0
ollama_timeout = 30

[PhilipsHue]
bridge_ip =
app_key =
light_ids =
brightness = 254
saturation = 0
hue = 14910

[Actions]
intruder_light_minutes = 4
intruder_video_folder = intruder_recordings
sound_folder = cat_scare_sound

[TimeManagement]
start_time = 18:00
end_time = 07:00
data_management_time = 07:10

[StorageManagement]
min_free_space_gb = 10
max_file_age_days = 2

[NAS]
nas_ip =
nas_user =
nas_destination_path = /path/to/backup/folder
nas_windows_share = Backups

[Notifications]
enabled = false
service = email
email_subject = Intruder Alert!
email_from = your_email@example.com
email_to = recipient@example.com
smtp_server = smtp.example.com
smtp_port = 587
smtp_user = your_email@example.com
smtp_password = your_app_password
telegram_bot_token =
telegram_chat_id =

[Debug]
window = true
exit_key = q
