# ===================================================================
# Hauptkonfiguration für die autonome Katzen-Analyse-Pipeline
# ===================================================================

[Input]
# Die Kameraquelle. '0' ist normalerweise die erste Webcam.
# Kann auch ein Pfad zu einer Videodatei sein (z.B. C:/videos/test.mp4).
camera_src = 0


[Backend]
# Inferenz-Engine für das KI-Modell.
# Optionen: "onnx", "onnxslim", "openvino", "pt", "safetensor", "coreml"
engine = onnx

# Gerät für die Inferenz.
# Optionen: "cpu", "gpu"
inference_device = cpu

# Anzahl der CPU-Kerne, die für die Inferenz verwendet werden sollen (nur bei device=cpu).
CPU_WORKERS = 4

# Größe des YOLO-Modells. Wird verwendet, um den richtigen Ordner zu finden.
# Optionen: "n", "s", "m", "l", "x"
model_size = m

# Generation des Modells. Wird ebenfalls für den Ordnerpfad verwendet.
model_generation = 11

# Pfad zum Hauptordner, der alle Modelle enthält.
inference_model_main_folder = inference_model_main_folder


[Active]
# Einstellungen für die hochauflösende, aktive Analysephase.

# Auflösung für die aktive Analyse (Breite,Höhe).
high_resolution = 1280,720
# Ziel-FPS für die aktive Analyse.
fps_high = 30
# Zeit in Sekunden, nach der die aktive Analyse ohne Erfolg abbricht (Timeout).
timeout_sec = 60


[Detection]
# Einstellungen für das zu erkennende Zielobjekt.

# Name der Klasse, nach der gesucht werden soll (z.B. "cat").
target_class_name = cat
# Mindest-Konfidenz (Sicherheit), damit eine Erkennung als Erfolg gilt (0.0 bis 1.0).
min_confidence = 0.80
# Ordner, in dem erfolgreiche Detektionen (Bilder und Bbox-Daten) gespeichert werden.
success_frame_folder = successful_detections


[PassivAnalyzerCamera]
# Einstellungen für die ressourcenschonende, passive Analysephase.

# Auflösung für die passive Analyse.
low_resolution = 640,480
# Ziel-FPS für die passive Analyse.
fps_low = 5


[PassivAnalyzerTrigger]
# Einstellungen für den Helligkeits-Trigger der passiven Analyse.

# Schwellenwert, unter dem ein Frame als "dunkel" gilt (0-255).
# Definiert den "Bereit"-Zustand, bevor auf Helligkeit geprüft wird.
darkness_threshold = 20
# Schwellenwert, über dem ein einzelner Pixel als "hell" gilt (0-255).
brightness_threshold = 220
# Prozentualer Anteil der Pixel, die heller als der Schwellenwert sein müssen (z.B. 0.01 für 1%).
brightness_pixel_percentage = 0.01
# Anzahl der aufeinanderfolgenden hellen Frames, die zum Auslösen benötigt werden.
trigger_frame_count = 5


[ColorAnalysis]
# Einstellungen für die Farbanalyse nach einer erfolgreichen Detektion.

# Methode für die Farbanalyse.
# Optionen: "hsv", "llm"
analysis_method = hsv

# --- HSV-Einstellungen (nur bei method = hsv) ---
# Untere und obere Grenze für die Farbe "Schwarz" im HSV-Farbraum (H,S,V).
lower_black_hsv = 0,0,0
upper_black_hsv = 180,255,60
# Prozentualer Anteil der Pixel in der Bounding Box, der schwarz sein muss.
black_pixel_threshold = 0.5

# --- LLM-Einstellungen (nur bei method = llm) ---
# Host-Adresse des laufenden Ollama-Servers.
ollama_host = http://localhost:11434
# Name des zu verwendenden Vision-Modells (z.B. "llava").
ollama_model = llava
# Der Prompt, der an das LLM gesendet wird.
ollama_prompt = Is the cat in this image black? Answer with only "yes" or "no".


[PhilipsHue]
# Die lokale IP-Adresse Ihrer Philips Hue Bridge.
bridge_ip = 
# Der generierte App-Key (Benutzername) für den Zugriff.
app_key = 
# IDs der Lichter, die gesteuert werden sollen. Mehrere mit Komma trennen (z.B. 1,2,3).
light_ids = 

# --- Einstellungen für den "Licht an"-Zustand ---
# Helligkeit (0-254). 254 ist maximal.
brightness = 254
# Farbsättigung (0-254). 0 ist weiß, 254 ist die reinste Farbe.
saturation = 0
# Farbton (0-65535). Repräsentiert eine Farbe auf dem Farbkreis.
hue = 14910


[Actions]
# Dauer in Minuten, die das Licht bei einem "Intruder" (nicht-schwarze Katze) anbleibt.
intruder_light_minutes = 4
# Ordner, in dem die "Intruder"-Videos gespeichert werden.
intruder_video_folder = intruder_recordings
# Ordner, der die abzuspielenden Abschreckungs-Sounds enthält.
sound_folder = cat_scare_sound


[TimeManagement]
# Zeitformat: HH:MM (24-Stunden-Format)
# Startzeit, ab der die passive Analyse aktiv wird.
start_time = 18:00
# Endzeit, zu der die passive Analyse stoppt.
end_time = 07:00
# Genaue Uhrzeit, zu der das Datenmanagement einmal täglich ausgeführt wird.
data_management_time = 07:10


[StorageManagement]
# Minimaler freier Speicherplatz in GB, der auf der Festplatte verbleiben soll.
min_free_space_gb = 10
# Maximales Alter von Dateien in Tagen, bevor sie gelöscht werden.
max_file_age_days = 2


[NAS]
# IP-Adresse oder Hostname des NAS.
nas_ip = 
# Benutzername für die Anmeldung am NAS.
nas_user = 
# Zielpfad auf dem NAS (für Linux/macOS via rsync).
nas_destination_path = /path/to/backup/folder
# Name der Windows-Freigabe (für Windows via robocopy).
nas_windows_share = Backups


[Notifications]
# Aktiviert oder deaktiviert das gesamte Benachrichtigungssystem.
# Optionen: true, false
enabled = false

# Dienst für den Versand.
# Optionen: "email", "telegram"
service = email

# --- E-Mail-Einstellungen (nur bei service = email) ---
email_subject = Intruder Alert!
email_from = your_email@example.com
email_to = recipient@example.com
smtp_server = smtp.example.com
smtp_port = 587
smtp_user = your_email@example.com
smtp_password = your_app_password

# --- Telegram-Einstellungen (nur bei service = telegram) ---
# Der Token Ihres Telegram-Bots.
telegram_bot_token = 
# Die Chat-ID des Empfängers (kann eine persönliche oder Gruppen-ID sein).
telegram_chat_id = 


[Debug]
# Allgemeine Debugging-Optionen.

# Zeigt das Live-Vorschaufenster der aktiven Analyse an.
# Optionen: true, false
window = true
# Taste zum Beenden der Anwendung, wenn das Vorschaufenster aktiv ist.
exit_key = q