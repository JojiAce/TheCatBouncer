# Conda-Umgebung für das autonome Katzen-Analyse-Projekt
#
# So erstellen Sie die Umgebung:
# conda env create -f environment.yml
#
# So aktivieren Sie die Umgebung:
# conda activate cat-analysis-env

name: cat-analysis-env

channels:
  - defaults
  - conda-forge

dependencies:
  # Kernabhängigkeiten
  - python=3.10
  - pip

  # Bibliotheken, die über Conda verfügbar sind
  - opencv
  - requests
  - numpy

  # Bibliotheken, die über Pip installiert werden, da sie
  # entweder nicht auf Conda verfügbar sind oder die Pip-Version
  # vorzuziehen ist.
  - pip:
    - pygame
    - ollama
